name: Story Studio V62 browser regression

on:
  push:
    branches:
      - ux/mobile-editor-v60-recovery
      - main
  pull_request:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - .github/workflows/v60-smoke.yml
  workflow_dispatch:

jobs:
  mobile-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact pull request commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify modular assets and HTML entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          css = Path("assets/css/story-studio.css").read_text()
          js = Path("assets/js/story-studio.js").read_text()
          assert 'assets/css/story-studio.css' in html
          assert 'assets/js/story-studio.js' in html
          assert 'viewport-fit=cover' in html, 'Mobile viewport must opt into device safe areas'
          assert 'env(safe-area-inset-top' in css, 'CSS must account for the top device safe area'
          assert 'env(safe-area-inset-bottom' in css, 'CSS must account for the bottom device safe area'
          assert len(re.findall(r'<style\b', html, re.I)) == 0
          assert len(re.findall(r'<script\b(?![^>]*src=)', html, re.I)) == 0
          for feature in ("startTextEditing", "addShape", "removeBackground", "copyPNG", "exportPNG", "moveLayer", "renderBlob"):
              assert feature in js, f"Missing runtime feature: {feature}"
          assert "aspect-ratio" in css
          print(f"Modular assets OK: HTML={len(html)} chars, CSS={len(css)} chars, JS={len(js)} chars")
          PY

      - name: Install browser test runner
        run: |
          npm init -y
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/story-studio-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Synchronize simulated keyboard viewport with visualViewport
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.locator('#home .hero .actions .btn').click();
            await page.waitForFunction(() => document.querySelector('#create')?.classList.contains('active'));
            await page.evaluate(() => window.addText('Keyboard layout verification'));
            await page.locator('#textValue').fill('Keyboard layout verification');
            await page.waitForFunction(() => document.activeElement?.id==='textValue');
            await page.setViewportSize({width:390,height:460});
            await page.waitForTimeout(200);
            await page.evaluate(() => {
              const input=document.getElementById('textValue');
              input.focus();
              document.body.classList.add('keyboard-open');
              const vv=window.visualViewport;
              if (vv) {
                Object.defineProperty(vv,'height',{configurable:true,value:460});
                Object.defineProperty(vv,'offsetTop',{configurable:true,value:0});
                vv.dispatchEvent(new Event('resize'));
              }
              window.v80KeyboardLayout?.();
            });
            await page.waitForTimeout(100);
            const state=await page.evaluate(() => {
              const stage=document.getElementById('stage').getBoundingClientRect();
              const wrap=document.getElementById('stage').parentElement.getBoundingClientRect();
              const vv=window.visualViewport;
              return {stage:{width:stage.width,height:stage.height,top:stage.top,bottom:stage.bottom},
                wrap:{height:wrap.height,top:wrap.top},keyboardOpen:document.body.classList.contains('keyboard-open'),
                visualViewport:{height:vv?.height,offsetTop:vv?.offsetTop},
                cssVariable:getComputedStyle(document.documentElement).getPropertyValue('--keyboard-preview-top')};
            });
            console.log('V80_KEYBOARD_CONTROLLER_STATE:',JSON.stringify(state));
            if(state.stage.height<230) throw new Error('V80 controller did not retain a readable preview: '+JSON.stringify(state));
            if(!state.keyboardOpen) throw new Error('Keyboard state was not retained');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Test mobile canvas, text editing, curve, and export; capture screenshots
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            acceptDownloads: true
          });
          const page = await context.newPage();
          page.on('pageerror', error => { errors.push(error.message); console.error('PAGE_ERROR:', error.stack || error.message); });
          page.on('console', msg => { if (msg.type() === 'error') console.error('BROWSER_CONSOLE_ERROR:', msg.text()); });

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          const languageButton = page.locator('#languageToggle');
          await page.waitForTimeout(500);
          const initialLanguageState = await page.evaluate(() => ({ lang: document.documentElement.lang, toggle: document.querySelector('#languageToggle')?.textContent, headline: document.querySelector('#home .hero h1')?.innerText, ready: document.readyState }));
          console.log('INITIAL_LANGUAGE_STATE:', JSON.stringify(initialLanguageState));
          assert.equal(initialLanguageState.lang, 'pt-BR', 'Portuguese should be the initial document language');
          assert.equal(initialLanguageState.toggle?.trim(), 'EN', 'Toggle should offer English after Portuguese initialization');
          assert.match(initialLanguageState.headline || '', /Faça seu Story/i, 'Home headline should be Brazilian Portuguese after initialization');
          const homeIdentity = await page.evaluate(() => {
            const hero = document.querySelector('#home .home-create-hero');
            const title = hero?.querySelector('h1');
            const logo = document.querySelector('header .logo');
            const cards = [...document.querySelectorAll('#home .home-action-card')];
            const rect = hero?.getBoundingClientRect();
            return {
              background: getComputedStyle(document.body).backgroundColor,
              font: getComputedStyle(title).fontFamily,
              titleSize: parseFloat(getComputedStyle(title).fontSize),
              heroRadius: getComputedStyle(hero).borderRadius,
              logo: logo?.innerText,
              cards: cards.length,
              heroWidth: rect?.width,
              viewportWidth: innerWidth,
              horizontalOverflow: document.documentElement.scrollWidth > innerWidth
            };
          });
          console.log('V62_HOME_IDENTITY_MOBILE:', JSON.stringify(homeIdentity));
          assert.equal(homeIdentity.background, 'rgb(255, 252, 244)', 'V62 home must use the approved ivory canvas');
          assert.match(homeIdentity.font, /DM Sans/, 'V62 interface heading must use the approved sans-serif');
          assert.ok(homeIdentity.titleSize >= 40, 'V62 home hero must retain prominent display type on mobile');
          assert.ok((homeIdentity.logo || '').includes('STORY') && (homeIdentity.logo || '').includes('STUDIO'), 'V62 brand signature must remain visible');
          assert.equal(homeIdentity.cards, 3, 'All three quick-start actions must remain visible');
          assert.equal(homeIdentity.horizontalOverflow, false, 'V62 home must not overflow horizontally on mobile');
          const fixedNav = await page.locator('nav.bottom').boundingBox();
          const lastHomeCard = await page.locator('#home .home-action-card').last().boundingBox();
          assert.ok(fixedNav && lastHomeCard && lastHomeCard.y + lastHomeCard.height <= fixedNav.y - 8, 'Mobile home cards must remain fully visible above the fixed navigation');
          await page.screenshot({ path: 'artifacts/v62-mobile-home.png', fullPage: true });
          assert.equal(await languageButton.innerText(), 'EN', 'After language initialization, Portuguese should be active and the toggle should offer English');
          assert.match(await page.locator('#home .hero h1').innerText(), /Faça seu Story/i, 'Home headline should start in Brazilian Portuguese');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang === 'en' && document.querySelector('#languageToggle')?.textContent.trim() === 'PT-BR' && /Make your Story/i.test(document.querySelector('#home .hero h1')?.innerText || ''), null, { timeout: 5000 });
          assert.equal(await languageButton.innerText(), 'PT-BR', 'Toggle should offer Portuguese while English is active');
          assert.match(await page.locator('#home .hero h1').innerText(), /Make your Story/i, 'Toggle should translate the home headline to English');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang === 'pt-BR' && document.querySelector('#languageToggle')?.textContent.trim() === 'EN' && /Faça seu Story/i.test(document.querySelector('#home .hero h1')?.innerText || ''), null, { timeout: 5000 });
          assert.match(await page.locator('#home .hero h1').innerText(), /Faça seu Story/i, 'Second toggle should restore Portuguese');
          await page.locator('.nav-btn[data-view="create"]').click();
          await page.waitForTimeout(350);
          const editorLanguagePT = await page.evaluate(() => ({
            lang:document.documentElement.lang,
            toggle:document.querySelector('#languageToggle')?.textContent.trim(),
            heading:document.querySelector('#create .editor-head h2')?.textContent.trim(),
            preview:document.querySelector('#create .live-preview-label')?.textContent.trim(),
            quickTools:document.querySelector('#create .quick-tool-grid')?.previousElementSibling?.textContent.trim(),
            paste:document.querySelector('#create .quick-tool-grid button:first-child')?.textContent.trim(),
            removeBg:document.querySelector('#removeBgBtn')?.textContent.trim(),
            copy:document.querySelector('#copyStoryBtn')?.textContent.trim(),
            export:document.querySelector('#exportStoryBtn')?.textContent.trim()
          }));
          console.log('EDITOR_LANGUAGE_PT:', JSON.stringify(editorLanguagePT));
          assert.equal(editorLanguagePT.lang,'pt-BR','Editor must retain Brazilian Portuguese');
          assert.equal(editorLanguagePT.toggle,'EN','Portuguese editor must offer English');
          assert.equal(editorLanguagePT.heading,'Crie seu Story.','Editor heading must be translated to Portuguese');
          assert.equal(editorLanguagePT.preview,'Prévia','Preview label must be translated to Portuguese');
          assert.equal(editorLanguagePT.quickTools,'Ferramentas rápidas','Quick tools heading must be translated to Portuguese');
          assert.equal(editorLanguagePT.paste,'Colar imagem','Paste action must be translated to Portuguese');
          assert.equal(editorLanguagePT.removeBg,'Remover fundo','Background action must be translated to Portuguese');
          assert.equal(editorLanguagePT.copy,'Copiar PNG','Copy action must be translated to Portuguese');
          assert.equal(editorLanguagePT.export,'Exportar PNG','Export action must be translated to Portuguese');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang==='en' && document.querySelector('#languageToggle')?.textContent.trim()==='PT-BR');
          const editorLanguageEN = await page.evaluate(() => ({
            heading:document.querySelector('#create .editor-head h2')?.textContent.trim(),
            preview:document.querySelector('#create .live-preview-label')?.textContent.trim(),
            quickTools:document.querySelector('#create .quick-tool-grid')?.previousElementSibling?.textContent.trim(),
            paste:document.querySelector('#create .quick-tool-grid button:first-child')?.textContent.trim(),
            removeBg:document.querySelector('#removeBgBtn')?.textContent.trim(),
            copy:document.querySelector('#copyStoryBtn')?.textContent.trim(),
            export:document.querySelector('#exportStoryBtn')?.textContent.trim()
          }));
          console.log('EDITOR_LANGUAGE_EN:', JSON.stringify(editorLanguageEN));
          assert.equal(editorLanguageEN.heading,'Create your Story.','Editor heading must return to English');
          assert.equal(editorLanguageEN.preview,'Preview','Preview label must return to English');
          assert.equal(editorLanguageEN.quickTools,'Quick tools','Quick tools heading must return to English');
          assert.equal(editorLanguageEN.paste,'Paste image','Paste action must return to English');
          assert.equal(editorLanguageEN.removeBg,'Remove background','Background action must return to English');
          assert.equal(editorLanguageEN.copy,'Copy PNG','Copy action must return to English');
          assert.equal(editorLanguageEN.export,'Export PNG','Export action must return to English');
          await languageButton.click();
          await page.waitForFunction(() => document.documentElement.lang==='pt-BR' && document.querySelector('#languageToggle')?.textContent.trim()==='EN');
          const mobileSurfaceState = await page.evaluate(() => {
            const wrap = document.querySelector('#create .stage-wrap');
            const stage = document.querySelector('#stage');
            const panel = document.querySelector('#create .panel');
            const dockEl = document.querySelector('#create .creation-dock');
            const dock = [...dockEl.querySelectorAll(':scope > button')].map(b=>b.innerText.trim().split('\n').pop());
            const dockRect = dockEl.getBoundingClientRect();
            const dockStyle = getComputedStyle(dockEl);
            const nav = document.querySelector('nav.bottom');
            const navRect = nav.getBoundingClientRect();
            const ancestorChain = [];
            for(let node=dockEl;node;node=node.parentElement){
              const s=getComputedStyle(node),r=node.getBoundingClientRect();
              ancestorChain.push({node:node.id?'#'+node.id:node.className||node.tagName,position:s.position,transform:s.transform,animationName:s.animationName,animationDuration:s.animationDuration,willChange:s.willChange,filter:s.filter,backdropFilter:s.backdropFilter,contain:s.contain,perspective:s.perspective,overflow:s.overflow,top:r.top,bottom:r.bottom,height:r.height});
            }
            return {
              wrapBackground:getComputedStyle(wrap).backgroundColor,
              dockDisplay:dockStyle.display,
              dockVisibility:dockStyle.visibility,
              dockOpacity:Number(dockStyle.opacity),
              dockPosition:dockStyle.position,
              dockZIndex:Number(dockStyle.zIndex),
              dockPointerEvents:dockStyle.pointerEvents,
              ancestorChain,
              navTop:navRect.top,
              panelDisplay:getComputedStyle(panel).display,
              panelVisible:getComputedStyle(panel).display!=='none',
              panelSections:[...panel.querySelectorAll(':scope > .panel-section')].filter(el=>!el.hidden&&getComputedStyle(el).display!=='none').length,
              textControlsVisible:getComputedStyle(document.querySelector('#textControls')).display!=='none'&&!document.querySelector('#textControls').hidden,
              selectionVisible:getComputedStyle(document.querySelector('#selectionPanelSection')).display!=='none'&&!document.querySelector('#selectionPanelSection').hidden,
              stageWidth:stage.getBoundingClientRect().width,
              dock,
              dockRect:{left:dockRect.left,right:dockRect.right,top:dockRect.top,bottom:dockRect.bottom,width:dockRect.width,height:dockRect.height},
              viewport:{width:innerWidth,height:innerHeight}
            };
          });
          console.log('MOBILE_SURFACE_STATE:', JSON.stringify(mobileSurfaceState));
          assert.notEqual(mobileSurfaceState.wrapBackground,'rgb(36, 36, 36)','Mobile preview frame must use the approved light surface');
          assert.equal(mobileSurfaceState.panelVisible,false,'No editing panel should appear before an element exists');
          assert.equal(mobileSurfaceState.panelSections,0,'Empty canvas must not show unrelated tool sections');
          assert.equal(mobileSurfaceState.textControlsVisible,false,'Text controls must stay hidden until text is added');
          assert.equal(mobileSurfaceState.selectionVisible,false,'Selected-layer controls must stay hidden until an element exists');
          assert.ok(mobileSurfaceState.stageWidth>300,'Mobile preview must fill the workspace width');
          assert.deepEqual(mobileSurfaceState.dock,['Texto','Foto','Formas'],'Empty canvas must offer only the three clear creation actions');
          assert.ok(mobileSurfaceState.dockRect.left>=0&&mobileSurfaceState.dockRect.right<=390&&mobileSurfaceState.dockRect.width>300,'Creation actions must fit inside the mobile viewport');
          assert.notEqual(mobileSurfaceState.dockDisplay,'none','Creation dock must be displayed on the empty mobile canvas');
          assert.equal(mobileSurfaceState.dockVisibility,'visible','Creation dock must be visible on the empty mobile canvas');
          assert.ok(mobileSurfaceState.dockOpacity>0,'Creation dock must not be transparent on the empty mobile canvas');
          assert.ok(mobileSurfaceState.dockRect.height>=48&&mobileSurfaceState.dockRect.bottom<=mobileSurfaceState.navTop+2,'Creation dock must be visible above the bottom navigation');
          // Existing end-to-end coverage below exercises text, shapes, photos, selection and export.
          // Keep the empty-canvas assertion focused on the three visible creation actions.
          
          const editorEntryState = await page.evaluate(() => {
            const view = document.querySelector('#create');
            const workspace = view.querySelector('.workspace');
            const wrap = view.querySelector('.stage-wrap');
            const stage = view.querySelector('#stage');
            const details = el => {
              const style = getComputedStyle(el), rect = el.getBoundingClientRect();
              const blockers = [];
              for(let node=el;node&&node!==document.documentElement;node=node.parentElement){
                const s=getComputedStyle(node),r=node.getBoundingClientRect();
                if(s.display==='none'||s.visibility==='hidden'||Number(s.opacity)===0||r.width===0||r.height===0){
                  blockers.push({node:node.id?'#'+node.id:node.className||node.tagName,display:s.display,visibility:s.visibility,opacity:s.opacity,width:r.width,height:r.height});
                }
              }
              return {display:style.display,visibility:style.visibility,opacity:style.opacity,width:rect.width,height:rect.height,hidden:el.hidden,blockers};
            };
            return {
              active:view.classList.contains('active'),
              navCreate:[...document.querySelectorAll('.nav-btn')].map(b=>({view:b.dataset.view,active:b.classList.contains('active')})),
              view:details(view),workspace:details(workspace),wrap:details(wrap),stage:details(stage),
              bodyClasses:document.body.className,viewport:{width:innerWidth,height:innerHeight}
            };
          });
          console.log('EDITOR_ENTRY_STATE:', JSON.stringify(editorEntryState));
          assert.equal(editorEntryState.active,true,'Create view must become active after choosing Create');
          assert.notEqual(editorEntryState.view.display,'none','Create view must be displayed after navigation');
          assert.notEqual(editorEntryState.workspace.display,'none','Editor workspace must be displayed after navigation');
          assert.notEqual(editorEntryState.wrap.display,'none','Preview wrapper must be displayed on the empty canvas');
          assert.equal(editorEntryState.wrap.visibility,'visible','Preview wrapper must be visible on the empty canvas');
          assert.notEqual(editorEntryState.stage.display,'none','Canvas element must be displayed on the empty canvas');
          assert.equal(editorEntryState.stage.visibility,'visible','Canvas must be visible on the empty canvas');
          const stage = page.locator('#stage');
          const stageVisible = await stage.evaluate(el => {
            const r=el.getBoundingClientRect(),s=getComputedStyle(el);
            return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0&&r.width>0&&r.height>0;
          });
          assert.equal(stageVisible,true,'Canvas must have visible geometry on editor entry');
          let rect = await stage.boundingBox();
          assert.ok(rect && rect.width > 100 && rect.height > 170, 'Mobile canvas must be visible and usable');
          assert.ok(rect.height / rect.width > 0.25 && rect.height / rect.width < 4, 'Visible preview must adapt to the available workspace instead of forcing a 9:16 frame');
          await page.screenshot({ path: 'artifacts/v62-mobile-empty-canvas.png' });

          await page.evaluate(() => window.addText('Story Studio V61'));
          await page.waitForTimeout(150);
          assert.equal(await page.locator('#textValue').inputValue(), 'Story Studio V61', 'New text must be retained in input');
          assert.ok(await page.locator('#stage .layer').count() === 1, 'Adding text must create a layer');
          const expandedPreview = await page.evaluate(() => {
            const stage=document.querySelector('#stage'),layer=stage.querySelector('.layer');
            const sr=stage.getBoundingClientRect(),lr=layer.getBoundingClientRect();
            const dockEl=document.querySelector('.creation-dock'),dockRect=dockEl.getBoundingClientRect();return {stageHeight:sr.height,stageWidth:sr.width,layerVisible:lr.width>0&&lr.height>0&&lr.bottom>sr.top&&lr.top<sr.bottom,copyExists:!!document.querySelector('#copyStoryBtn'),copyActionCount:document.querySelectorAll('#create .editor-actions button[id*="copy"]').length,duplicateCopyAction:!!document.querySelector('#copyPNGTopBtn'),dockVisible:getComputedStyle(dockEl).display!=='none'&&dockRect.width>300,dock:dockRect};
          });
          assert.ok(expandedPreview.stageHeight > 180 && expandedPreview.stageHeight < 520, 'Preview must remain useful without consuming the full mobile workspace');
          assert.ok(expandedPreview.dock.bottom <= 844, 'Creation actions must remain within the mobile viewport');
          assert.equal(expandedPreview.layerVisible,true,'New text must remain visible inside the expanded preview');
          assert.equal(expandedPreview.copyExists,true,'Copy PNG must be available beside Export PNG');
          assert.equal(expandedPreview.copyActionCount,1,'The editor must show exactly one Copy PNG action');
          console.log('EXPANDED_PREVIEW_STATE:', JSON.stringify(expandedPreview));
          assert.equal(expandedPreview.dockVisible,true,'Creation dock must remain visible while text is focused and the keyboard is closed');
          assert.equal(expandedPreview.duplicateCopyAction,false,'No duplicate Copy PNG action may be injected at runtime');
          assert.ok(Math.abs((expandedPreview.dock.left+expandedPreview.dock.right)/2-195)<3,'Creation actions must be centered in the dock');

          rect = await stage.boundingBox();
          const layerRect = await page.locator('#stage .layer').boundingBox();
          assert.ok(layerRect, 'Text layer must render on canvas');
          const centerRatio = (layerRect.y + layerRect.height / 2 - rect.y) / rect.height;
          const textLayerState = await page.evaluate(() => {
            const stage = document.querySelector('#stage');
            const layer = document.querySelector('#stage .layer');
            return {
              stageWidth: stage.getBoundingClientRect().width,
              stageHeight: stage.getBoundingClientRect().height,
              layerLeft: layer.style.left,
              layerTop: layer.style.top,
              layerTransform: layer.style.transform
            };
          });
          console.log('TEXT_LAYER_GEOMETRY:', JSON.stringify({ stage: rect, layer: layerRect, centerRatio, ...textLayerState }));
          assert.ok(centerRatio > 0.42 && centerRatio < 0.58, 'New text must stay centered after the mobile preview resizes for editing');
          await page.locator('#textValue').fill('Prévia em tempo real');
          await page.waitForFunction(() => document.querySelector('#stage .layer .text-content')?.textContent === 'Prévia em tempo real');
          assert.equal(await page.locator('#stage .layer .text-content').innerText(), 'Prévia em tempo real', 'The canvas preview must update while typing');
          await page.locator('#textValue').fill('Story Studio V61');
          await page.screenshot({ path: 'artifacts/v62-mobile-text-focus.png' });
          const typingPreview = await page.evaluate(() => {
            const canvasEl=document.querySelector('#stage'), inputEl=document.querySelector('#textValue');
            const panel=document.querySelector('#create .panel'), controls=document.querySelector('#textControls'), entry=document.querySelector('#textEntryField');
            const canvas=canvasEl.getBoundingClientRect(), input=inputEl.getBoundingClientRect();
            const style=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return {display:s.display,visibility:s.visibility,opacity:s.opacity,rect:{top:r.top,bottom:r.bottom,width:r.width,height:r.height},hidden:el.hidden,inlineDisplay:el.style.display}};
            return {
              canvasTop:canvas.top,canvasBottom:canvas.bottom,inputTop:input.top,inputBottom:input.bottom,
              inputFocused:document.activeElement.id==='textValue',
              panel:style(panel),controls:style(controls),entry:style(entry),input:style(inputEl),
              parentSections:[...panel.querySelectorAll(':scope > .panel-section')].map(style),
              ancestorChain:(()=>{const out=[];let el=panel;while(el&&out.length<7){const s=getComputedStyle(el),r=el.getBoundingClientRect();out.push({tag:el.tagName,id:el.id,className:typeof el.className==='string'?el.className:'',position:s.position,transform:s.transform,filter:s.filter,contain:s.contain,overflow:s.overflow,rect:{top:r.top,bottom:r.bottom,height:r.height}});el=el.parentElement;}return out;})()
            };
          });
          console.log('TYPING_PREVIEW_STATE:', JSON.stringify(typingPreview));
          const typingPanelBox = typingPreview.panel.rect;
          const typingInputBox = typingPreview.input.rect;
          const typingCreateTransform = await page.locator('#create').evaluate(el => getComputedStyle(el).transform);
          assert.equal(typingPreview.inputFocused, true, 'Text field must retain focus after creating a layer');
          assert.equal(typingCreateTransform, 'none', 'Animated editor wrapper must not trap fixed typing controls');
          assert.ok(typingPanelBox.height >= 120, 'Typing panel must have enough height to show the text input');
          assert.ok(typingPanelBox.top <= typingInputBox.top && typingPanelBox.bottom >= typingInputBox.bottom, 'Visible panel must contain the full text input field');
          assert.ok(typingPreview.canvasBottom <= typingPreview.inputTop + 10, 'Pinned preview should not overlap text input');

          await page.setViewportSize({ width: 390, height: 460 });
          await page.waitForTimeout(180); // Let viewport listeners settle before applying the keyboard-state emulation.
          await page.evaluate(() => document.body.classList.add('keyboard-open'));
          const keyboardController = await page.evaluate(() => window.v80KeyboardLayout?.() || null);
          assert.equal(keyboardController?.open, true, 'V80 keyboard controller must engage after keyboard-state emulation');
          assert.ok(keyboardController.stageHeight >= 230, 'V80 controller must retain a readable preview while the keyboard is open');
          await page.waitForTimeout(50);
          const keyboardState = await page.evaluate(() => {
            const canvas = document.querySelector('#stage').getBoundingClientRect();
            const input = document.querySelector('#textValue').getBoundingClientRect();
            const panel = document.querySelector('#create .panel').getBoundingClientRect();
            return {
              canvasTop: canvas.top, canvasBottom: canvas.bottom,
              inputTop: input.top, inputBottom: input.bottom,
              panelTop: panel.top, panelBottom: panel.bottom, panelHeight: panel.height,
              keyboardOpen:document.body.classList.contains('keyboard-open'),
              viewport: window.innerHeight
            };
          });
          const keyboardLayout = await page.evaluate(() => ({
            stageWrap: (() => { const r = document.querySelector('#stage').parentElement.getBoundingClientRect(); return { top:r.top, bottom:r.bottom, height:r.height }; })(),
            bodyClasses: document.body.className,
            previewTopVariable: getComputedStyle(document.documentElement).getPropertyValue('--keyboard-preview-top')
          }));
